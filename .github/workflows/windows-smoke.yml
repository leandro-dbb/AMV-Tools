# End-to-end smoke test on a REAL Windows VM (GitHub-hosted runner).
#
# Builds the same NSIS installer as the release, installs it silently, starts
# the installed app, then drives its sidecar through the HTTP API: CPU backend
# install, model download, indexing, search, clip export and every timeline
# export format. It checks the produced files, captures a screenshot of the
# real window, quits the app through the normal path and verifies no process
# is left behind.
#
# Test-only hooks used by this workflow (inert for normal users):
#   AMV_TOKEN, AMV_SIDECAR_PORT       fixed token/port for the sidecar
#   AMV_SMOKE_SCREENSHOT_DIR          window screenshots via capturePage()
#   AMV_SMOKE_QUIT_FILE               quit gracefully when this file appears
# Run it from the Actions tab (Run workflow) or by pushing to jarvis/**.
name: windows-smoke

on:
  workflow_dispatch:
  push:
    branches: ['jarvis/**']

permissions:
  contents: read

concurrency:
  group: windows-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Install + index + export on windows-latest
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Fetch uv binary (bundled by the installer)
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          New-Item -ItemType Directory -Force .uv | Out-Null
          Copy-Item "$env:USERPROFILE\.local\bin\uv.exe" .uv\uv.exe
          .\.uv\uv.exe --version

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Build renderer + main
        working-directory: app
        run: npm run build

      - name: Package NSIS installer (same as release, unsigned)
        working-directory: app
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish never

      - name: Locate and install the installer silently
        shell: pwsh
        run: |
          $installer = Get-ChildItem app/release/*.exe | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer produced" }
          Write-Host "Installer: $($installer.FullName) ($([math]::Round($installer.Length/1MB,1)) MB)"
          $p = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Silent install failed with $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\AMV Tools\AMV Tools.exe'
          if (-not (Test-Path $exe)) {
            $exe = (Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter 'AMV Tools.exe' |
                    Select-Object -First 1).FullName
          }
          if (-not $exe) { throw "Installed app not found under %LOCALAPPDATA%\Programs" }
          Write-Host "Installed exe: $exe"
          "AMV_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Launch the installed app and wait for /health
        shell: pwsh
        run: |
          $art = Join-Path $env:RUNNER_TEMP 'amv-artifacts'
          $userData = Join-Path $art 'userdata'
          New-Item -ItemType Directory -Force $art, $userData | Out-Null
          $token = 'smoke-token'
          $port = 8765
          $env:AMV_TOKEN = $token
          $env:AMV_SIDECAR_PORT = "$port"
          $env:AMV_DATA_DIR = $userData
          $env:AMV_SMOKE_SCREENSHOT_DIR = Join-Path $art 'screenshots'
          $env:AMV_SMOKE_QUIT_FILE = Join-Path $art 'quit.flag'
          $env:ELECTRON_ENABLE_LOGGING = '1'
          $env:PYTHONUNBUFFERED = '1'
          $p = Start-Process -FilePath $env:AMV_EXE `
            -ArgumentList "--user-data-dir=$userData" -PassThru `
            -RedirectStandardOutput (Join-Path $art 'electron.out.log') `
            -RedirectStandardError (Join-Path $art 'electron.err.log')
          $p.Id | Out-File (Join-Path $art 'app.pid')
          Write-Host "App PID $($p.Id); waiting for http://127.0.0.1:$port/health"
          $headers = @{ 'X-AMV-Token' = $token }
          $deadline = (Get-Date).AddMinutes(15)
          $ok = $false
          while ((Get-Date) -lt $deadline) {
            try {
              $h = Invoke-RestMethod -Uri "http://127.0.0.1:$port/health" -Headers $headers -TimeoutSec 5
              if ($h.ok) { $ok = $true; break }
            } catch { Start-Sleep -Seconds 3 }
          }
          if (-not $ok) {
            Get-Content (Join-Path $art 'electron.err.log') -ErrorAction SilentlyContinue | Select-Object -Last 80
            Get-Content (Join-Path $art 'electron.out.log') -ErrorAction SilentlyContinue | Select-Object -Last 80
            throw "Sidecar /health never answered (first-run uv sync may have failed)"
          }
          Write-Host "Sidecar healthy: $($h | ConvertTo-Json -Compress)"

      - name: Install CPU backend through the app API
        shell: pwsh
        run: |
          $art = Join-Path $env:RUNNER_TEMP 'amv-artifacts'
          $headers = @{ 'X-AMV-Token' = 'smoke-token' }
          $base = 'http://127.0.0.1:8765'
          $r = Invoke-RestMethod -Method Post -Uri "$base/api/setup/install" -Headers $headers `
                -ContentType 'application/json' -Body (@{ backend = 'cpu' } | ConvertTo-Json) -TimeoutSec 3600
          $r.log | Out-File (Join-Path $art 'setup-cpu.log') -Encoding utf8
          if (-not $r.ok) { throw "CPU backend install failed: $($r.hint)`n$($r.log)" }
          $status = Invoke-RestMethod -Uri "$base/api/status" -Headers $headers
          Write-Host "Status: $($status | ConvertTo-Json -Compress)"
          if ($status.device -ne 'cpu') { throw "Expected CPU on a GPU-less runner, got '$($status.device)'" }

      - name: Generate test clips (ffmpeg, short extracts)
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            $env:PATH = "$env:PATH;C:\ProgramData\chocolatey\bin"
          }
          $art = Join-Path $env:RUNNER_TEMP 'amv-artifacts'
          $media = Join-Path $art 'media'
          New-Item -ItemType Directory -Force $media | Out-Null
          $a = Join-Path $media "DBS Beerus 01 — extrait é.mp4"
          $b = Join-Path $media "Black Clover S02E04 'cut'.mp4"
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i "testsrc2=size=1280x720:rate=24000/1001" `
            -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 24 `
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest $a
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg failed for clip A" }
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i "testsrc2=size=640x360:rate=25" -t 12 `
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p $b
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg failed for clip B" }
          Get-ChildItem $media | Format-Table Name, Length
          "AMV_CLIP_A=$a" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AMV_CLIP_B=$b" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Model status + index both clips (CPU)
        shell: pwsh
        run: |
          $art = Join-Path $env:RUNNER_TEMP 'amv-artifacts'
          $headers = @{ 'X-AMV-Token' = 'smoke-token' }
          $base = 'http://127.0.0.1:8765'
          $models = Invoke-RestMethod -Uri "$base/api/models/status" -Headers $headers
          $models.models | ConvertTo-Json -Depth 5 | Out-File (Join-Path $art 'models-before.json') -Encoding utf8
          $queue = @{ paths = @(
              @{ path = $env:AMV_CLIP_A; recursive = $false; group = 'Smoke' },
              @{ path = $env:AMV_CLIP_B; recursive = $false; group = 'Smoke' }
          ) } | ConvertTo-Json -Depth 5
          $q = Invoke-RestMethod -Method Post -Uri "$base/api/index/queue" -Headers $headers `
                -ContentType 'application/json' -Body $queue
          if ($q.added -lt 2) { throw "Queue accepted $($q.added) of 2 clips" }
          Invoke-RestMethod -Method Post -Uri "$base/api/index/start" -Headers $headers `
            -ContentType 'application/json' -Body (@{ phases = @('tag','embed') } | ConvertTo-Json) | Out-Null
          $deadline = (Get-Date).AddMinutes(30)
          $done = $false
          while ((Get-Date) -lt $deadline) {
            $videos = (Invoke-RestMethod -Uri "$base/api/videos" -Headers $headers).videos
            $indexed = @($videos | Where-Object { $_.scene_count -gt 0 -and @('completed','tags_only','embeddings_only') -contains $_.status })
            Write-Host ("videos: " + (($videos | ForEach-Object { "$($_.display_name)=$($_.status)/$($_.scene_count)" }) -join '; '))
            if ($videos.Count -ge 2 -and $indexed.Count -ge 2) { $done = $true; break }
            Start-Sleep -Seconds 10
          }
          if (-not $done) {
            Get-Content (Join-Path $art 'userdata\logs\backend.log') -ErrorAction SilentlyContinue | Select-Object -Last 120
            throw "Indexing did not finish within 30 minutes"
          }
          $videos | ConvertTo-Json -Depth 5 | Out-File (Join-Path $art 'videos.json') -Encoding utf8
          $models = Invoke-RestMethod -Uri "$base/api/models/status" -Headers $headers
          $models.models | ConvertTo-Json -Depth 5 | Out-File (Join-Path $art 'models-after.json') -Encoding utf8

      - name: Search, clip export and every timeline format
        shell: pwsh
        run: |
          $art = Join-Path $env:RUNNER_TEMP 'amv-artifacts'
          $headers = @{ 'X-AMV-Token' = 'smoke-token' }
          $base = 'http://127.0.0.1:8765'
          $out = Join-Path $art 'exports'
          New-Item -ItemType Directory -Force $out | Out-Null   # ascii: API checks unicode below
          $unicodeDir = Join-Path $art "sorties é 日本"
          New-Item -ItemType Directory -Force $unicodeDir | Out-Null

          $videos = (Invoke-RestMethod -Uri "$base/api/videos" -Headers $headers).videos
          $sceneIds = @()
          foreach ($v in $videos) {
            $scenes = (Invoke-RestMethod -Uri "$base/api/videos/$($v.id)/scenes" -Headers $headers).scenes
            $sceneIds += @($scenes | Select-Object -First 3 | ForEach-Object { $_.id })
          }
          $sceneIds = @($sceneIds | Select-Object -Unique)
          if ($sceneIds.Count -lt 2) { throw "Expected at least 2 scenes, got $($sceneIds.Count)" }
          Write-Host "Scene ids: $($sceneIds -join ', ')"
          $sceneIds | ConvertTo-Json | Out-File (Join-Path $art 'scene_ids.json') -Encoding utf8

          $search = Invoke-RestMethod -Method Post -Uri "$base/api/search" -Headers $headers `
            -ContentType 'application/json' -Body (@{ query = 'colorful test pattern'; top_k = 10; threshold = 0.0 } | ConvertTo-Json)
          $search | ConvertTo-Json -Depth 5 | Out-File (Join-Path $art 'search.json') -Encoding utf8
          if ($search.total -lt 1) { throw "Search returned no results" }
          Write-Host "Search results: $($search.total)"

          $clip = Invoke-RestMethod -Method Post -Uri "$base/api/export" -Headers $headers `
            -ContentType 'application/json' -Body (@{ scene_id = $sceneIds[0]; output_path = (Join-Path $out 'clip.mp4') } | ConvertTo-Json)
          if (-not (Test-Path $clip.output) -or (Get-Item $clip.output).Length -lt 1000) {
            throw "Clip export failed: $($clip.output)"
          }
          Write-Host "Clip export: $($clip.output) ($((Get-Item $clip.output).Length) bytes)"

          $formats = (Invoke-RestMethod -Uri "$base/api/timeline/formats" -Headers $headers).formats
          $formats | ConvertTo-Json -Depth 5 | Out-File (Join-Path $art 'formats.json') -Encoding utf8
          $expected = @('fcp7xml','fcpxml','edl','otio')
          $present = @($formats | ForEach-Object { $_.id })
          Write-Host "Formats: $($present -join ', ')"

          foreach ($f in $formats) {
            $target = Join-Path $unicodeDir ("amv timeline " + $f.id + $f.extension)
            $body = @{
              scene_ids = $sceneIds
              format = $f.id
              output_path = $target
              options = @{ sequence_fps = 'first'; layout = 'gaps'; gap_frames = 2; markers = $true; include_audio = $true; title = "Smoke é $($f.id)" }
            } | ConvertTo-Json -Depth 6
            $r = Invoke-RestMethod -Method Post -Uri "$base/api/timeline/export" -Headers $headers `
                  -ContentType 'application/json' -Body $body -TimeoutSec 300
            if (-not (Test-Path $target)) { throw "Timeline $($f.id) was not written" }
            $size = (Get-Item $target).Length
            if ($size -lt 100) { throw "Timeline $($f.id) is suspiciously small ($size bytes)" }
            $text = Get-Content -Raw -Encoding utf8 $target
            switch ($f.id) {
              'fcp7xml'      { $null = [xml]$text; if ($text -notmatch '<xmeml') { throw "fcp7xml: no xmeml root" } }
              'fcpxml'       { $null = [xml]$text; if ($text -notmatch '<fcpxml version') { throw "fcpxml: no fcpxml root" } }
              'edl'          { if ($text -notmatch 'TITLE:') { throw "edl: no TITLE" }
                               if ($text -notmatch 'FROM CLIP NAME:') { throw "edl: no FROM CLIP NAME" } }
              'vegas'        { if ($text -notmatch 'TITLE:') { throw "vegas: no TITLE" }
                               if ($text -notmatch 'FROM CLIP NAME:') { throw "vegas: no FROM CLIP NAME" } }
              'otio'         { $j = $text | ConvertFrom-Json; if ($j.OTIO_SCHEMA -ne 'Timeline.1') { throw "otio: bad schema" } }
              'aftereffects' { if ($text -notmatch 'beginUndoGroup') { throw "aftereffects: not a JSX script" } }
            }
            Write-Host "  $($f.id): $target ($size bytes)"
          }
          $missing = @($expected | Where-Object { $present -notcontains $_ })
          if ($missing.Count -gt 0) { throw "Missing timeline formats: $($missing -join ', ')" }

          $all = Get-ChildItem $out, $unicodeDir -Recurse -File
          $all | Select-Object FullName, Length | Format-Table -AutoSize
          $all | ForEach-Object { "{0}`t{1}" -f $_.Length, $_.FullName } |
            Out-File (Join-Path $art 'exports-manifest.txt') -Encoding utf8

      - name: GPU detection degrades cleanly (no GPU on this runner)
        shell: pwsh
        run: |
          $art = Join-Path $env:RUNNER_TEMP 'amv-artifacts'
          $headers = @{ 'X-AMV-Token' = 'smoke-token' }
          $diag = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/diagnostics' -Headers $headers -TimeoutSec 60
          $diag | ConvertTo-Json -Depth 8 | Out-File (Join-Path $art 'diagnostics.json') -Encoding utf8
          if ($diag.device.active -ne 'cpu') { throw "Expected cpu in diagnostics, got $($diag.device.active)" }
          if (-not $diag.ffmpeg.version) { throw "Diagnostics: ffmpeg not found by the packaged sidecar" }
          $env:HF_ENDPOINT = 'http://127.0.0.1:9'
          $env:HF_HUB_DOWNLOAD_TIMEOUT = '2'
          $venvPy = Join-Path $env:RUNNER_TEMP 'amv-artifacts\userdata\.venv\Scripts\python.exe'
          if (-not (Test-Path $venvPy)) { throw "Sidecar venv not found at $venvPy" }
          $resources = Join-Path (Split-Path $env:AMV_EXE) 'resources'
          $env:PYTHONPATH = $resources
          $script = @'
          import sys
          from backend.models.device import detect_device
          auto = detect_device("auto")
          forced = detect_device("dml")
          print("auto:", auto.backend, auto.name)
          print("dml-forced:", forced.backend, forced.name)
          if auto.backend != "cpu" or forced.backend != "cpu":
              sys.exit(2)
          from backend.model_download import download_file, ModelDownloadError
          try:
              download_file("hf-internal-testing/tiny-random-gpt2", "config.json", max_attempts=1)
          except ModelDownloadError as exc:
              print("offline hint:", exc.hint)
              if "connection" not in exc.hint.lower() and "internet" not in exc.hint.lower():
                  sys.exit(3)
          else:
              print("UNEXPECTED: download succeeded with an unreachable endpoint")
              sys.exit(4)
          print("OK")
          '@
          $script | Out-File (Join-Path $art 'offline-check.py') -Encoding utf8
          Push-Location $resources
          & $venvPy (Join-Path $art 'offline-check.py') 2>&1 | Tee-Object (Join-Path $art 'offline-check.log')
          $offlineExit = $LASTEXITCODE
          Pop-Location
          if ($offlineExit -ne 0) { throw "GPU/offline degradation check failed (exit $offlineExit)" }

      - name: Quit through the normal path and verify no process remains
        shell: pwsh
        run: |
          $art = Join-Path $env:RUNNER_TEMP 'amv-artifacts'
          $pidFile = Join-Path $art 'app.pid'
          $appPid = [int](Get-Content $pidFile)
          New-Item -ItemType File -Force (Join-Path $art 'quit.flag') | Out-Null
          $deadline = (Get-Date).AddSeconds(120)
          while ((Get-Date) -lt $deadline) {
            if (-not (Get-Process -Id $appPid -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Seconds 2
          }
          $left = Get-Process -Id $appPid -ErrorAction SilentlyContinue
          if ($left) {
            Stop-Process -Id $appPid -Force -ErrorAction SilentlyContinue
            throw "The app did not quit within 120 s of the graceful-quit request"
          }
          Start-Sleep -Seconds 3
          $userData = Join-Path $art 'userdata'
          $stragglers = Get-CimInstance Win32_Process |
            Where-Object { $_.CommandLine -and $_.CommandLine -like "*$userData*" }
          $stragglers | Select-Object ProcessId, Name, CommandLine |
            Format-List | Out-String | Out-File (Join-Path $art 'stragglers.txt') -Encoding utf8
          if ($stragglers) {
            $stragglers | ForEach-Object { Write-Host "STRAY: $($_.Name) $($_.ProcessId) $($_.CommandLine)" }
            throw "Python/uv/ffmpeg processes were left running after quit"
          }
          Write-Host "No process left behind."

      - name: Check the backend log for real failures
        if: always()
        shell: pwsh
        run: |
          $art = Join-Path $env:RUNNER_TEMP 'amv-artifacts'
          $log = Join-Path $art 'userdata\logs\backend.log'
          if (Test-Path $log) {
            Copy-Item $log (Join-Path $art 'backend.log') -Force
            $bad = Select-String -Path $log -Pattern 'ModuleNotFoundError|Address already in use|Traceback \(most recent call last\)' -SimpleMatch:$false
            if ($bad) {
              $bad | ForEach-Object { Write-Host $_.Line }
              throw "backend.log contains a startup/runtime failure ($($bad.Count) matches)"
            }
          } else {
            Write-Warning "No backend.log at $log"
          }

      - name: Upload artifacts (screenshot, logs, exports)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-smoke-${{ github.run_number }}
          path: ${{ runner.temp }}/amv-artifacts
          if-no-files-found: warn
          retention-days: 14
