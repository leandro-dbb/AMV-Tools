name: Bug report
description: Something broke or behaved unpredictably
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please attach the diagnostic report so we can tell
        an environment problem from an app bug.

        In the app: **Settings → Diagnostic → Copy report**, then paste it below.
        It contains versions, GPU/CPU status, model state and recent errors — no
        video files.

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report
      description: Paste the Markdown produced by Settings → Diagnostic → Copy report.
      render: markdown
      placeholder: |
        ## AMV Tools diagnostic report
        ...
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behaviour and the error message you saw.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Library tab
        2. Import an episode
        3. Click Start indexing
        4. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Indexing / Library
        - Search / Tags
        - Derush / playback
        - Export / Mini editor
        - Mask / alpha (beta)
        - Settings / onboarding
        - Installation / startup
        - Other
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Acceleration backend
      options:
        - NVIDIA CUDA
        - Apple Silicon (MPS)
        - DirectML
        - Intel XPU
        - AMD ROCm
        - CPU only
        - Not sure (see diagnostic report)
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: From the diagnostic report, or the release you installed.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 23H2 / macOS 15.1 / Ubuntu 24.04
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I did not attach any copyrighted video file, only screenshots/logs.
          required: true
